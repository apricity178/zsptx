name: 打卡提醒推送

on:
  schedule:
    - cron: '0 0 * * *'    # 北京时间 08:00（UTC+8）
    - cron: '55 11 * * *'  # 北京时间 19:55（UTC+8）下班前提醒
  workflow_dispatch:    # 允许手动触发
    inputs:
      type:
        description: '强制指定推送类型'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 判断并推送
        env:
          TOKENS: ${{ secrets.PUSHPLUS_TOKENS }}
          LOCATION_ID: ${{ secrets.QWEATHER_LOCATION_ID }}
          TITLE: 打卡提醒
        run: |
          # ---- 1. 确定推送类型 ----
          TYPE="${{ github.event.inputs.type }}"

          if [ "$TYPE" = "auto" ] || [ -z "$TYPE" ]; then
            HOUR=$(TZ=Asia/Shanghai date +%H)
            echo "北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            if [ "$HOUR" -lt 12 ]; then
              TYPE="morning"
            else
              TYPE="evening"
            fi
          fi

          echo ">>> 本次推送类型: $TYPE <<"

          # ---- 2. 构造推送 URL ----
          BASE="https://apricity178.vercel.app/api/cron"
          URL="${BASE}?tokens=${TOKENS}&title=${TITLE}&forceType=${TYPE}&locationId=${LOCATION_ID}"
          URL="${URL}&specialDatesJson=%7B%22myBirthday%22%3A%2210-23%22%2C%22herBirthday%22%3A%2209-27%22%2C%22anniversary%22%3A%222025-08-20%22%7D"

          # ---- 3. 执行推送 ----
          echo "请求: $BASE （类型: $TYPE）"
          RESPONSE=$(curl -sf "$URL" || echo "CURL_ERROR")

          if [ "$RESPONSE" = "CURL_ERROR" ]; then
            echo "❌ 推送请求失败（网络错误或 API 不可达）"
            exit 1
          fi

          echo "响应: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"code":200'; then
            echo "✅ 推送成功！"
          elif echo "$RESPONSE" | grep -q '"code":0'; then
            echo "✅ 推送成功（code:0）！"
          else
            echo "❌ 推送失败，响应异常"
            echo "$RESPONSE"
            exit 1
          fi
