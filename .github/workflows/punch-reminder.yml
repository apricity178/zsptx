name: 打卡提醒推送

on:
  schedule:
    - cron: '55 23 * * *'  # 北京时间 07:55
    - cron: '55 9 * * *'   # 北京时间 17:55
    - cron: '55 21 * * *'  # 北京时间 05:55
    - cron: '55 7 * * *'   # 北京时间 15:55
  workflow_dispatch:  # 允许手动触发
    inputs:
      type:
        description: '强制指定推送类型'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 判断并推送
        env:
          PUSH_URL: https://zsptx-a3yy.vercel.app/api/cron
        run: |
          CONFIG_FILE="config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ config.json 不存在"
            exit 1
          fi

          TOKENS=$(cat $CONFIG_FILE | jq -r '.tokens // empty')
          LOCATION_ID=$(cat $CONFIG_FILE | jq -r '.locationId // "101181502"')
          TITLE=$(cat $CONFIG_FILE | jq -r '.title // "打卡提醒"')
          SPECIAL_DATES=$(cat $CONFIG_FILE | jq -r '.specialDates | @json')

          if [ -z "$TOKENS" ]; then
            echo "❌ 未配置 PushPlus Token"
            exit 1
          fi

          # ---- 确定推送类型 ----
          TYPE="${{ github.event.inputs.type }}"

          if [ "$TYPE" = "auto" ] || [ -z "$TYPE" ]; then
            HOUR=$(TZ=Asia/Shanghai date +%H)
            echo "📍 北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            if [ "$HOUR" -lt 12 ]; then
              TYPE="morning"
            else
              TYPE="evening"
            fi
          fi

          echo ">>> 本次推送类型: $TYPE <<<"

          # ---- 构造 URL ----
          SPECIAL_DATES_ENCODED=$(echo "$SPECIAL_DATES" | jq -r '@uri')
          TITLE_ENCODED=$(echo "$TITLE" | jq -Rr @uri)
          URL="${PUSH_URL}?tokens=${TOKENS}&title=${TITLE_ENCODED}&forceType=${TYPE}&locationId=${LOCATION_ID}&specialDatesJson=${SPECIAL_DATES_ENCODED}"

          echo "🌐 请求: ${PUSH_URL}?tokens=***&forceType=${TYPE}&locationId=${LOCATION_ID}"

          # ---- 执行推送 ----
          RESPONSE=$(curl -sf "$URL" || echo "CURL_ERROR")

          if [ "$RESPONSE" = "CURL_ERROR" ]; then
            echo "❌ 推送请求失败（网络错误或 API 不可达）"
            exit 1
          fi

          echo "📨 响应: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"code":200\|"code":0'; then
            echo "✅ 推送成功！"
          else
            echo "⚠️ 推送响应异常"
            echo "$RESPONSE"
          fi

      - name: 输出完成信息
        run: |
          echo "========================================"
          echo "📋 打卡提醒推送任务完成"
          echo "🕐 执行时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "🌐 仓库: ${{ github.repository }}"
          echo "========================================"
