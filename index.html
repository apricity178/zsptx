<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡提醒配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        label span {
            color: #999;
            font-weight: normal;
            font-size: 12px;
        }
        input[type="text"],
        input[type="time"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .token-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .token-info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
        .token-info a {
            color: #667eea;
            text-decoration: none;
        }
        .token-info a:hover {
            text-decoration: underline;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .status.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }
        .status.loading {
            display: block;
            background: #cce5ff;
            color: #004085;
            text-align: center;
        }
        .status-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        .hidden {
            display: none;
        }
        .special-date-inputs {
            display: grid;
            gap: 10px;
        }
        .special-date-inputs input {
            margin-bottom: 0;
        }
        .repo-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .repo-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .repo-btn:hover {
            border-color: #667eea;
        }
        .repo-btn.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .repo-btn .name {
            font-weight: 600;
            color: #333;
        }
        .repo-btn .desc {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>打卡提醒配置</h1>
            <p class="subtitle">通过 GitHub API 自动同步配置</p>

            <div id="tokenSection" class="token-section">
                <div class="form-group">
                    <label>GitHub Personal Access Token</label>
                    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                    <div class="token-info">
                        <strong>需要配置 Token 才能保存修改</strong><br>
                        1. 点击 <a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">创建 Token</a><br>
                        2. 勾选 <code>repo</code> 权限<br>
                        3. 生成后粘贴到这里<br>
                        4. Token 仅用于本次操作，不会上传到任何地方
                    </div>
                </div>
                <div class="form-group">
                    <label>选择仓库</label>
                    <div class="repo-selector">
                        <div class="repo-btn selected" data-repo="zsptx">
                            <div class="name">zsptx</div>
                            <div class="desc">当前使用</div>
                        </div>
                        <div class="repo-btn" data-repo="Serverless-Function">
                            <div class="name">Serverless-Function</div>
                            <div class="desc">备用</div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" id="loadBtn" onclick="loadConfig()">加载配置</button>
            </div>

            <div id="status" class="status"></div>

            <div id="configSection" class="hidden">
                <div class="section-title">推送时间设置</div>
                <div class="row">
                    <div class="form-group">
                        <label>上班推送时间 <span>(北京时间)</span></label>
                        <input type="time" id="morningTime" value="08:00">
                    </div>
                    <div class="form-group">
                        <label>下班推送时间 <span>(北京时间)</span></label>
                        <input type="time" id="eveningTime" value="19:55">
                    </div>
                </div>

                <div class="form-group">
                    <label>推送标题</label>
                    <input type="text" id="title" placeholder="打卡提醒">
                </div>

                <div class="section-title">推送内容（可选）</div>
                <div class="form-group">
                    <label>上班提醒内容 <span>(留空使用默认)</span></label>
                    <textarea id="morningContent" placeholder="老公/老婆，早上好呀~记得打卡上班哦~"></textarea>
                </div>
                <div class="form-group">
                    <label>下班提醒内容 <span>(留空使用默认)</span></label>
                    <textarea id="eveningContent" placeholder="老公/老婆，下班时间到啦~记得打卡下班~"></textarea>
                </div>

                <div class="section-title">特殊日期</div>
                <div class="special-date-inputs">
                    <div class="form-group">
                        <label>我的生日 <span>(MM-DD)</span></label>
                        <input type="text" id="myBirthday" placeholder="10-23">
                    </div>
                    <div class="form-group">
                        <label>她的生日 <span>(MM-DD)</span></label>
                        <input type="text" id="herBirthday" placeholder="09-27">
                    </div>
                    <div class="form-group">
                        <label>纪念日 <span>(YYYY-MM-DD)</span></label>
                        <input type="text" id="anniversary" placeholder="2025-08-20">
                    </div>
                </div>

                <div class="section-title">PushPlus 配置</div>
                <div class="form-group">
                    <label>PushPlus Token <span>(多个用逗号分隔)</span></label>
                    <input type="text" id="tokens" placeholder="abc123...,def456...">
                </div>
                <div class="form-group">
                    <label>和风天气 Location ID</label>
                    <input type="text" id="locationId" placeholder="101181502">
                    <div class="token-info">
                        和风天气位置ID，可在 <a href="https://qweather.com" target="_blank">和风天气官网</a> 搜索获取
                    </div>
                </div>

                <button class="btn btn-primary" id="saveBtn" onclick="saveConfig()">保存配置</button>
                <button class="btn btn-secondary" onclick="loadConfig()">重新加载</button>
            </div>
        </div>
    </div>

    <script>
        const OWNER = 'apricity178';
        let SELECTED_REPO = 'zsptx';
        let CURRENT_CONFIG = null;
        let ORIGINAL_SHA = null;

        // 仓库选择
        document.querySelectorAll('.repo-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.repo-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                SELECTED_REPO = btn.dataset.repo;
            });
        });

        function showStatus(message, type) {
            const status = document.getElementById('status');
            const icons = { success: '✓', error: '✗', loading: '⟳' };
            status.className = `status ${type}`;
            status.innerHTML = `<span class="status-icon">${icons[type]}</span>${message}`;
        }

        async function githubRequest(path, options = {}) {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                throw new Error('请输入 GitHub Token');
            }

            const response = await fetch(`https://api.github.com${path}`, {
                ...options,
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || `请求失败 (${response.status})`);
            }

            return response.json();
        }

        async function loadConfig() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                showStatus('请先输入 GitHub Token', 'error');
                return;
            }

            showStatus('正在加载配置...', 'loading');
            document.getElementById('saveBtn').disabled = true;

            try {
                // 获取 config.json
                const fileResponse = await githubRequest(
                    `/repos/${OWNER}/${SELECTED_REPO}/contents/config.json`
                );

                const content = atob(fileResponse.content);
                ORIGINAL_SHA = fileResponse.sha;
                CURRENT_CONFIG = JSON.parse(content);

                // 填充表单
                document.getElementById('morningTime').value = CURRENT_CONFIG.morningTime || '08:00';
                document.getElementById('eveningTime').value = CURRENT_CONFIG.eveningTime || '19:55';
                document.getElementById('title').value = CURRENT_CONFIG.title || '打卡提醒';
                document.getElementById('morningContent').value = CURRENT_CONFIG.morningContent || '';
                document.getElementById('eveningContent').value = CURRENT_CONFIG.eveningContent || '';
                document.getElementById('myBirthday').value = CURRENT_CONFIG.specialDates?.myBirthday || '10-23';
                document.getElementById('herBirthday').value = CURRENT_CONFIG.specialDates?.herBirthday || '09-27';
                document.getElementById('anniversary').value = CURRENT_CONFIG.specialDates?.anniversary || '2025-08-20';
                document.getElementById('tokens').value = CURRENT_CONFIG.tokens || '';
                document.getElementById('locationId').value = CURRENT_CONFIG.locationId || '101181502';

                // 显示配置区域
                document.getElementById('tokenSection').style.display = 'none';
                document.getElementById('configSection').classList.remove('hidden');
                document.getElementById('saveBtn').disabled = false;

                showStatus(`配置加载成功 (${SELECTED_REPO})`, 'success');
            } catch (error) {
                // 如果文件不存在，返回配置页面
                if (error.message.includes('404')) {
                    showStatus('config.json 不存在，将创建新文件', 'loading');
                    setTimeout(() => {
                        document.getElementById('tokenSection').style.display = 'none';
                        document.getElementById('configSection').classList.remove('hidden');
                        document.getElementById('saveBtn').disabled = false;
                    }, 1000);
                } else {
                    showStatus(error.message, 'error');
                }
            }
        }

        async function saveConfig() {
            showStatus('正在保存配置...', 'loading');
            document.getElementById('saveBtn').disabled = true;

            try {
                // 收集表单数据
                const config = {
                    title: document.getElementById('title').value.trim() || '打卡提醒',
                    morningTime: document.getElementById('morningTime').value || '08:00',
                    eveningTime: document.getElementById('eveningTime').value || '19:55',
                    morningContent: document.getElementById('morningContent').value.trim(),
                    eveningContent: document.getElementById('eveningContent').value.trim(),
                    specialDates: {
                        myBirthday: document.getElementById('myBirthday').value.trim() || '10-23',
                        herBirthday: document.getElementById('herBirthday').value.trim() || '09-27',
                        anniversary: document.getElementById('anniversary').value.trim() || '2025-08-20'
                    },
                    locationId: document.getElementById('locationId').value.trim() || '101181502',
                    tokens: document.getElementById('tokens').value.trim()
                };

                // 验证时间格式
                const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
                if (!timeRegex.test(config.morningTime) || !timeRegex.test(config.eveningTime)) {
                    throw new Error('时间格式不正确，请使用 HH:MM 格式');
                }

                // 转换为 cron 表达式
                const morningCron = timeToCron(config.morningTime);
                const eveningCron = timeToCron(config.eveningTime);

                const fileContent = JSON.stringify(config, null, 2);

                // 保存 config.json
                const saveResponse = await githubRequest(
                    `/repos/${OWNER}/${SELECTED_REPO}/contents/config.json`,
                    {
                        method: 'PUT',
                        body: JSON.stringify({
                            message: `更新配置 ${new Date().toLocaleString('zh-CN')}`,
                            content: btoa(unescape(encodeURIComponent(fileContent))),
                            sha: ORIGINAL_SHA || undefined
                        })
                    }
                );

                ORIGINAL_SHA = saveResponse.content.sha;

                // 更新 workflow 文件中的时间
                await updateWorkflow(morningCron, eveningCron);

                showStatus('配置保存成功！GitHub Actions 将自动使用新配置', 'success');
            } catch (error) {
                showStatus(error.message, 'error');
            } finally {
                document.getElementById('saveBtn').disabled = false;
            }
        }

        async function updateWorkflow(morningCron, eveningCron) {
            try {
                // 获取 workflow 文件
                const workflowResponse = await githubRequest(
                    `/repos/${OWNER}/${SELECTED_REPO}/contents/.github/workflows/punch-reminder.yml`
                );

                let workflowContent = atob(workflowResponse.content);

                // 更新 cron 表达式
                // 替换上班时间 cron
                workflowContent = workflowContent.replace(
                    /- cron: '[^*]*\* \* \*'/,
                    `- cron: '${morningCron}'`
                );
                // 替换下班时间 cron
                workflowContent = workflowContent.replace(
                    /- cron: '[^*]*\* \* \*'\s*#.*下班/,
                    `- cron: '${eveningCron}'`
                );

                // 保存 workflow
                await githubRequest(
                    `/repos/${OWNER}/${SELECTED_REPO}/contents/.github/workflows/punch-reminder.yml`,
                    {
                        method: 'PUT',
                        body: JSON.stringify({
                            message: `更新推送时间 [自动配置]`,
                            content: btoa(unescape(encodeURIComponent(workflowContent))),
                            sha: workflowResponse.sha
                        })
                    }
                );
            } catch (error) {
                console.warn('Workflow 更新失败:', error.message);
                // 不影响主配置保存
            }
        }

        function timeToCron(time) {
            const [hours, minutes] = time.split(':').map(Number);
            return `${minutes} ${hours} * * *`;
        }
    </script>
</body>
</html>
